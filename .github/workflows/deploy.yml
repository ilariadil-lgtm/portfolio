name: Deploy

# Si attiva solo su push a main — il gesto deliberato del go-live descritto
# in CONTESTO.md, non un incidente. Su lavori/piano-intervento non fa nulla.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installa dipendenze
        run: npm ci

      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-south-1

      - name: Build e pubblicazione
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
          DISTRIBUZIONE: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: ./infra/deploy.sh
